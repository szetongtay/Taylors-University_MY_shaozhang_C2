<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Hunter - Pick Time</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap');
        :root { --primary-red: #FF4757; --primary-orange: #FF7F50; --primary-yellow: #FFD32A; --card-bg: #FFFFFF; --text-dark: #2F3542; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: linear-gradient(135deg, #FFD3A5 0%, #FD6585 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 90%; max-width: 1100px; height: 85vh; max-height: 650px; background-color: #FFF9F4; border-radius: 36px; box-shadow: 0 20px 50px rgba(253, 101, 133, 0.4), inset 0 0 0 8px #FFF; display: flex; flex-direction: row; padding: 30px; position: relative; overflow: hidden; }
        .bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.4); z-index: 1; pointer-events: none; }
        .bubble-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .bubble-2 { width: 200px; height: 200px; bottom: -50px; right: -50px; background: rgba(255, 211, 42, 0.4); }
        .sidebar { width: 45%; display: flex; flex-direction: column; padding-right: 30px; border-right: 3px dashed #FFD3A5; overflow-y: auto; z-index: 2; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 32px; color: var(--primary-red); margin-bottom: 5px; }
        .header p { font-size: 14px; color: var(--primary-orange); font-weight: 800; margin-bottom: 20px; text-transform: uppercase; }
        .back-link { font-size: 14px; color: #A4B0BE; font-weight: 800; cursor: pointer; margin-bottom: 15px; display: inline-block; text-decoration: none;}
        .back-link:hover { color: var(--primary-orange); }
        .filter-group { margin-bottom: 20px; }
        .filter-title { font-size: 15px; font-weight: 800; color: var(--text-dark); margin-bottom: 10px; display: block; }
        .filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-btn { background-color: #FFF; color: var(--primary-orange); border: 2px solid var(--primary-orange); padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 0 rgba(255, 127, 80, 0.2); }
        .filter-btn.active { background-color: var(--primary-orange); color: #FFF; box-shadow: 0 4px 0 #D95A2B; transform: translateY(2px); }
        .filter-btn.diet { border-color: #2ECC71; color: #2ECC71; box-shadow: 0 4px 0 rgba(46, 204, 113, 0.2); }
        .filter-btn.diet.active { background-color: #2ECC71; box-shadow: 0 4px 0 #27AE60; color: white;}
        .main-area { width: 55%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-left: 30px; z-index: 2; }
        .mystery-box { width: 220px; height: 220px; background: var(--card-bg); border-radius: 40px; border: 4px dashed var(--primary-yellow); display: flex; justify-content: center; align-items: center; font-size: 90px; box-shadow: 0 15px 35px rgba(255, 71, 87, 0.15); margin-bottom: 30px; }
        .spin-btn { background: linear-gradient(135deg, var(--primary-red), var(--primary-orange)); color: #FFF; border: none; padding: 18px 40px; border-radius: 50px; font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 0 #C0392B, 0 15px 20px rgba(255, 71, 87, 0.4); transition: all 0.1s; width: 100%; max-width: 320px; }
        .spin-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 #C0392B; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="sidebar">
            <div class="header">
                <a class="back-link" href="index.html">← Back to Home</a>
                <h1>Set Preferences ⚙️</h1>
                <p>Customize your hunt</p>
            </div>
            <div class="filter-group">
                <span class="filter-title">⏰ Meal Time</span>
                <div class="filters" id="time-filters"></div>
            </div>
            <div class="filter-group">
                <span class="filter-title">👥 How many people?</span>
                <div class="filters" id="people-filters"></div>
            </div>
            <div class="filter-group">
                <span class="filter-title">💰 Budget</span>
                <div class="filters" id="budget-filters"></div>
            </div>
            <div class="filter-group">
                <span class="filter-title">🥗 Dietary Preference</span>
                <div class="filters" id="diet-filters"></div>
            </div>
        </div>
        <div class="main-area">
            <div class="mystery-box">🍱</div>
            <button class="spin-btn" onclick="goToResult()">FIND FOOD!</button>
        </div>
    </div>
    <script src="picktime.js"></script>
</body>
</html>
